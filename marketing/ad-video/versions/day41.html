<script>
// "Day 41": a working mother and her son are living in their car. Told like her own phone diary.
// She asks for help, strangers give, three days later there is dinner. Illustrated dramatization.
const { el, SKIN, HAIR, CLOTH } = CD;
const S = CD.sets, put = (...a) => CD.put(...a);
const RENEE = { who: 'renee', skin: SKIN.medium, hair: HAIR.dark, hairStyle: 'bun', top: CLOTH.slate, style: 'hoodie', seed: 41 };
const SON = { who: 'son', kid: true, skin: SKIN.medium, hair: HAIR.dark, hairStyle: 'curly', top: CLOTH.navy, style: 'hoodie', seed: 42 };
const SON_DAY = Object.assign({}, SON, { pack: CLOTH.steel });
const KS = 1.18, SON_X = -330, MOM_X = -140, HOOD = -206;
const sL = (x, y, sx = SON_X) => [(x - sx) / KS, y / KS];
const mL = (x, y, mx = MOM_X) => [x - mx, y];
const add = (g, p) => { g.appendChild(p.g || p); return p; };

/** A parked car at dawn or night with Renee in the driver's seat. */
function carScene(g, time) {
  const night = time === 'night';
  S.carFront(g, { time, lump: true });
  if (night) S.tint(g, '#5d6d98');           // the car goes dark, she stays readable
  const renee = add(g, CD.person(RENEE).place(0, 44, 1));
  const breath = el('g', {}, g);
  const phone = CD.prop('phone', { screen: '#f2f7ff' }); g.appendChild(phone);
  S.carDash(g, { time, wash: !night });
  let glow = null;
  if (night) { S.tint(g, '#aab7d6', 0.62); glow = S.glow(g, 0, -326, 150, 185, 0.42); }
  return { renee, breath, phone, glow };
}
/** The lot with the car as a table and the two of them behind the hood. */
function lotScene(g, time, sonSpec) {
  S.lot(g, { time });
  const son = add(g, CD.person(sonSpec).place(SON_X, 0, KS));
  const renee = add(g, CD.person(RENEE).place(MOM_X, 0, 1));
  S.carSide(g, { time });
  const table = el('g', {}, g);
  return { son, renee, table };
}
/** A stranger who gives: home, phone, one tap, and the amount rising from the screen. */
function giver(person, o, amount) {
  return {
    bg: o.wall || '#e6edf1',
    build(g) {
      S.home(g, { wall: o.wall, mugX: o.mugX ?? -230, window: o.window ?? -560, lampX: o.lampX ?? 260 });
      this.p = add(g, CD.person(person).place(0, 0, 1));
      const isl = el('g', {}, g);
      el('rect', { x: -1600, y: -212, width: 3200, height: 18, fill: '#f3f5f4', rx: 3 }, isl);
      el('rect', { x: -1600, y: -196, width: 3200, height: 1200, fill: CD.vgrad(o.front || '#355046', o.front2 || '#283d34') }, isl);
      this.ph = CD.prop('phone', { screen: '#f7f9f6' }); g.appendChild(this.ph);
      this.chip = el('g', {}, g);
      el('rect', { x: -62, y: -30, width: 124, height: 60, rx: 30, fill: '#2e7d32' }, this.chip);
      const t = el('text', { x: 0, y: 12, 'text-anchor': 'middle', 'font-family': 'IN', 'font-weight': 760, 'font-size': 34, fill: '#fff' }, this.chip);
      t.textContent = amount;
    },
    update(t, lt) {
      const d = this.t1 - this.t0, tap = d * 0.5;
      this.a = this.a || CD.animate(this.p, [
        [0, { ex: 'calm', gy: 0.95, nod: 6, lh: [-16, -276], rh: [18, -284] }],
        [d * 0.3, { ex: 'worried', gy: 0.95, nod: 7, lh: [-16, -276], rh: [18, -284] }],
        [tap, { ex: 'focused', gy: 0.95, nod: 7, lh: [-16, -276], rh: [14, -290] }],
        [tap + 0.5, { ex: 'smile', gy: 0.6, nod: 3, tilt: 3, lh: [-16, -278], rh: [18, -286] }],
        [d, { ex: 'relief', gy: 0.2, nod: 0, tilt: 4, lh: [-16, -278], rh: [18, -286] }],
      ]);
      this.a(lt, t);
      const h = this.p.handWorld('l'), h2 = this.p.handWorld('r');
      const px = (h[0] + h2[0]) / 2, py = (h[1] + h2[1]) / 2 - 12;
      put(this.ph, px, py, 0, 1, 1.3);
      const k = CD.prog(lt, tap + 0.1, d - 0.2);
      put(this.chip, px + 88, py - 20 - CD.eo(k) * 150, 0, CD.win(lt, tap + 0.1, d, 0.25), 0.5 + 0.24 * CD.back(CD.prog(lt, tap + 0.1, tap + 0.5)));
    },
    cam: CD.cam({ landscape: [[0, [0, -340, 400, 320]], [4, [0, -346, 350, 285]]], portrait: [[0, [0, -340, 320, 400]], [4, [0, -346, 285, 360]]] }),
  };
}

const shots = {
  // 0:00 selfie at dawn
  selfie: {
    bg: '#1c262c', roll: 0.6, shake: 2.2,
    build(g) { this.sc = carScene(g, 'dawn'); this.sc.phone.style.display = 'none'; this.puffs = [0, 1, 2].map(() => el('circle', { fill: CD.rgrad([[0, '#ffffff', 0.9], [1, '#ffffff', 0]]), opacity: 0 }, this.sc.breath)); },
    update(t, lt) {
      const { renee } = this.sc;
      this.a = this.a || CD.animate(renee, [
        [0, { ex: 'worried', brow: 9, smile: -0.1, rh: [150, -236] }],
        [2.0, { ex: 'worried', brow: 9, smile: -0.1, rh: [150, -236] }],
        [2.5, { ex: 'worried', brow: 8, gx: -0.9, gy: 0.2, turn: -0.55, tilt: -4, rh: [150, -236] }],
        [3.6, { ex: 'worried', brow: 8, gx: -0.9, gy: 0.2, turn: -0.55, tilt: -4, rh: [150, -236] }],
        [4.3, { ex: 'brave', smile: 0.3, tilt: 2, rh: [150, -236] }],
        [6.4, { ex: 'brave', smile: 0.2, gy: 0.3, tilt: 2, rh: [150, -236] }],
      ]);
      this.a(lt, t);
      const [hx, hy] = renee.headWorld();
      this.puffs.forEach((p, i) => {
        const k = CD.prog(lt, 0.7 + i * 1.5, 2.1 + i * 1.5);
        p.setAttribute('cx', hx + 26 + k * 60); p.setAttribute('cy', hy + 24 - k * 46); p.setAttribute('r', 10 + k * 34);
        p.setAttribute('opacity', (k > 0 && k < 1 ? 0.42 * Math.sin(Math.PI * k) : 0).toFixed(3));
      });
    },
    cam: CD.cam({ landscape: [[0, [0, -350, 400, 310]], [6.4, [0, -356, 350, 280]]], portrait: [[0, [0, -352, 290, 370]], [6.4, [0, -358, 258, 336]]] }),
  },
  // 0:06 the back seat
  backseat: {
    bg: '#1c262c', roll: 0.5, shake: 2,
    build(g) {
      S.carBack(g);
      const pillow = CD.prop('backpack', { color: '#7b8b99' }); pillow.setAttribute('transform', 'translate(-486 -254) scale(1.6) rotate(90)'); g.appendChild(pillow);
      const w = el('g', { transform: 'translate(-330 -262) rotate(-82) scale(1.5) translate(0 236)' }, g);
      this.kid = CD.person(SON).place(0, 0, 1); w.appendChild(this.kid.g);
      this.bag = el('g', {}, g);
      el('path', { d: 'M -285 -205 Q -292 -332 -170 -340 Q 150 -376 430 -332 Q 524 -312 524 -240 Q 524 -180 440 -178 L -230 -178 Q -285 -180 -285 -205 Z', fill: CD.vgrad('#3d8f44', '#246a2b') }, this.bag);
      for (let i = 0; i < 6; i++) el('path', { d: `M ${-170 + i * 118} ${-338 - Math.sin(i * 0.6) * 14} L ${-160 + i * 118} -180`, fill: 'none', stroke: '#1f5a26', 'stroke-width': 4, opacity: 0.6 }, this.bag);
      el('path', { d: 'M -282 -214 Q -240 -250 -150 -256', fill: 'none', stroke: '#a9d4ad', 'stroke-width': 6, 'stroke-linecap': 'round' }, this.bag);
      el('circle', { cx: -258, cy: -232, r: 16, fill: SON.skin }, g);
      S.carBackFront(g);
    },
    update(t, lt) {
      this.kid.set(this.kid.P({ ex: 'closed', brow: 2, smile: 0.22, noBlink: true, lh: [-12, -172], rh: [12, -172] }), t);
      this.bag.setAttribute('transform', `translate(0 -178) scale(1 ${(1 + 0.02 * Math.sin(t * 1.5)).toFixed(4)}) translate(0 178)`);
    },
    cam: CD.cam({ landscape: [[0, [150, -470, 760, 430]], [4.6, [-150, -320, 700, 400]], [10.2, [-210, -288, 590, 340]]],
      portrait: [[0, [170, -480, 600, 540]], [4.6, [-170, -300, 560, 470]], [10.2, [-230, -280, 460, 400]]] }),
  },
  // 0:16 the gas-station mirror
  mirror: {
    bg: '#dde6e4', roll: 0.25, shake: 1.2,
    build(g) {
      S.bathroom(g);
      this.son = add(g, CD.person(SON).place(-110, 0, KS));
      this.renee = add(g, CD.person(RENEE).place(60, 0, 1));
      this.brush = el('g', {}, g);
      el('rect', { x: -6, y: 0, width: 12, height: 48, rx: 5, fill: '#4a5b6c' }, this.brush);
      el('rect', { x: -17, y: -36, width: 34, height: 40, rx: 11, fill: '#33424a' }, this.brush);
      for (let i = 0; i < 4; i++) el('line', { x1: -10 + i * 6.6, y1: -30, x2: -10 + i * 6.6, y2: -4, stroke: '#7b8b99', 'stroke-width': 2 }, this.brush);
      S.sink(g);
    },
    update(t, lt) {
      const m = (x, y) => mL(x, y, 60), k = (x, y) => sL(x, y, -110);
      const stroke = lt < 2.7 ? Math.sin(lt * 5.2) * 34 : 0;
      this.r = this.r || CD.animate(this.renee, [
        [0, { ex: 'calm', gx: -0.7, gy: 0.5, turn: -0.3, tilt: -3, lh: m(-108, -334) }],
        [2.7, { ex: 'calm', gx: -0.7, gy: 0.5, turn: -0.3, tilt: -3, lh: m(-108, -334) }],
        [3.1, { ex: 'calm', gx: -0.7, gy: 0.6, turn: -0.3, tilt: -3, lh: m(-20, -236) }],
        [3.6, { ex: 'calm', gx: -0.7, gy: 0.6, turn: -0.3, tilt: -4, lh: m(-70, -222) }],
        [4.7, { ex: 'hurt', brow: 14, smile: 0, gx: -0.7, gy: 0.55, turn: -0.3, tilt: -4, lh: m(-70, -222) }],
        [5.0, { ex: 'smile', brow: 7, gx: -0.2, gy: 0.1, turn: -0.1, tilt: -2, lh: m(-72, -222) }],
        [6.6, { ex: 'smile', brow: 7, gx: -0.2, gy: 0.1, turn: -0.1, tilt: -2, lh: m(-72, -222) }],
        [7.8, { ex: 'sad', brow: 13, smile: -0.2, gy: 0.8, nod: 5, lh: m(-72, -222) }],
        [9.0, { ex: 'calm', eye: 0.1, gy: 0.8, nod: 8, hx: -8, tilt: -8, lean: -12, lh: m(-30, -226) }],
        [11.0, { ex: 'calm', eye: 0.1, gy: 0.8, nod: 9, hx: -8, tilt: -9, lean: -13, lh: m(-30, -226) }],
      ]);
      this.r(lt, t);
      if (stroke) this.renee.set(this.renee.P({ ex: 'calm', gx: -0.7, gy: 0.5, turn: -0.3, tilt: -3, lh: m(-108 + stroke, -334 + Math.abs(stroke) * 0.12) }), t);
      this.s = this.s || CD.animate(this.son, [
        [0, { ex: 'neutral', gy: 0.1 }],
        [2.8, { ex: 'neutral', gy: 0.1 }],
        [3.1, { ex: 'worried', brow: 9, gx: 0.7, gy: -0.7, turn: 0.3, tilt: 5 }],
        [4.6, { ex: 'worried', brow: 9, gx: 0.7, gy: -0.7, turn: 0.3, tilt: 5 }],
        [6.4, { ex: 'hopeful', gx: 0.7, gy: -0.7, turn: 0.3, tilt: 5 }],
        [7.2, { ex: 'brave', smile: 0.5, gy: 0, tilt: 0 }],
        [11.0, { ex: 'smile', gy: 0, tilt: 2 }],
      ]);
      this.s(lt, t);
      const h = this.renee.handWorld('l');
      if (lt < 2.95) put(this.brush, h[0], h[1] + 6, -12);
      else put(this.brush, -8, -214, 84);
    },
    cam: CD.cam({ landscape: [[0, [-25, -300, 520, 330]], [11, [-35, -306, 450, 296]]], portrait: [[0, [-25, -300, 400, 400]], [11, [-35, -306, 350, 360]]] }),
  },
  // 0:27 school drop-off through the windshield
  dropoff: {
    bg: '#141b1f', roll: 0.5, shake: 2,
    build(g) {
      const out = S.windshieldOut(g);
      this.front = CD.person(SON_DAY); out.appendChild(this.front.g);
      this.back = CD.person(Object.assign({}, SON_DAY, { back: true })); out.appendChild(this.back.g);
      S.windshieldIn(g);
      this.tree = el('g', {}, g);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 70, stroke: '#9aa6ad', 'stroke-width': 3 }, this.tree);
      el('path', { d: 'M 0 60 L 26 104 L 12 104 L 34 140 L -34 140 L -12 104 L -26 104 Z', fill: '#2e7d32' }, this.tree);
    },
    update(t, lt) {
      const turned = lt >= 2.3;
      this.front.g.style.display = turned ? 'none' : '';
      this.back.g.style.display = turned ? '' : 'none';
      this.front.place(70, -62, 1);
      this.front.set(this.front.P({ ex: 'brave', smile: 0.45, rh: [64 + Math.sin(lt * 10) * 14, -300], tilt: 3 }), t);
      const k = CD.prog(lt, 2.3, 5.0), ph = lt * Math.PI * 3.4;
      this.back.place(CD.lerp(70, 10, k), CD.lerp(-62, -150, k), CD.lerp(1, 0.74, k));
      this.back.set(this.back.P({ bob: -Math.abs(Math.sin(ph)) * 7, liftL: Math.max(0, Math.sin(ph)) * 15, liftR: Math.max(0, -Math.sin(ph)) * 15 }), t);
      this.tree.setAttribute('transform', `translate(0 -722) rotate(${(Math.sin(t * 2.1) * 5).toFixed(2)})`);
    },
    cam: CD.cam({ landscape: [[0, [0, -520, 1500, 700]], [5, [0, -530, 1320, 620]]], portrait: [[0, [30, -450, 560, 620]], [5, [26, -462, 480, 550]]] }),
  },
  // 0:32 eleven dollars
  coins: {
    bg: '#12191d', roll: 0.4, shake: 1.6,
    build(g) { this.u = S.wheel(g, { skin: RENEE.skin, sleeve: RENEE.top }); },
    update(t, lt) { this.u(lt); },
    cam: CD.cam({ landscape: [[0, [0, -40, 1180, 680]], [9.4, [0, -30, 1040, 600]]], portrait: [[0, [0, 30, 880, 920]], [9.4, [0, 40, 780, 820]]] }),
  },
  // 0:42 one sandwich
  sandwich: {
    bg: '#1f2832', roll: 0.3, shake: 1.4,
    build(g) {
      this.sc = lotScene(g, 'dusk', SON);
      el('rect', { x: -292, y: HOOD - 4, width: 180, height: 8, rx: 3, fill: '#f1f4f2' }, this.sc.table);
      this.his = S.sandwich(this.sc.table, 1);
      this.hers = S.sandwich(this.sc.table, -1);
      S.tint(g, '#93a6c8', 0.5);
      S.glow(g, -330, -380, 420, 380, 0.22);
    },
    update(t, lt) {
      const { son, renee } = this.sc;
      this.s = this.s || CD.animate(son, [
        [0, { ex: 'neutral', gx: 0.4, gy: 0.7, nod: 3, rh: sL(-244, -224) }],
        [2.4, { ex: 'sad', brow: 10, smile: -0.1, gx: 0.4, gy: 0.7, nod: 3, rh: sL(-244, -224) }],
        [3.3, { ex: 'brave', gx: 0.5, gy: 0.5, rh: sL(-190, -224) }],
        [3.6, { ex: 'brave', gx: 0.7, gy: -0.7, turn: 0.3, tilt: 5, rh: sL(-190, -224) }],
        [5.6, { ex: 'brave', gx: 0.7, gy: -0.7, turn: 0.3, tilt: 5, rh: sL(-262, -214) }],
        [7.0, { ex: 'brave', gx: 0.6, gy: 0.5, turn: 0.2, rh: sL(-262, -214) }],
        [7.6, { ex: 'neutral', gx: 0.4, gy: 0.6, rh: sL(-240, -226) }],
        [9.6, { ex: 'neutral', gx: 0.4, gy: 0.6, rh: sL(-240, -226) }],
        [10.3, { ex: 'calm', gy: 0.3, rh: sL(-316, -256) }],
        [14.4, { ex: 'calm', gy: 0.3, rh: sL(-316, -256) }],
      ]);
      this.s(lt, t);
      if (lt > 10.3) son.set(son.P({ ex: 'calm', gy: 0.3, open: 0.25 + 0.25 * Math.sin(lt * 9), rh: sL(-316, -256) }), t);
      this.r = this.r || CD.animate(renee, [
        [0, { ex: 'sad', brow: 10, gx: -0.5, gy: 0.8, nod: 5 }],
        [3.4, { ex: 'sad', brow: 10, gx: -0.5, gy: 0.8, nod: 5 }],
        [4.2, { ex: 'hurt', gx: -0.8, gy: 0.5, turn: -0.35, tilt: -5 }],
        [5.8, { ex: 'hurt', gx: -0.8, gy: 0.5, turn: -0.35, tilt: -5, tear: 0.1 }],
        [6.2, { ex: 'hurt', gx: -0.6, gy: 0.7, turn: -0.3, tilt: -5, lh: mL(-190, -224), tear: 0.3 }],
        [7.0, { ex: 'brave', gx: -0.7, gy: 0.5, turn: -0.3, tilt: -5, lh: mL(-240, -224), tear: 0.5 }],
        [7.8, { ex: 'brave', gx: -0.8, gy: 0.4, turn: -0.35, tilt: -7, lh: mL(-318, -322), tear: 0.7 }],
        [10.4, { ex: 'brave', gx: -0.8, gy: 0.4, turn: -0.35, tilt: -8, lh: mL(-314, -324), tear: 1 }],
        [11.6, { ex: 'closed', brow: 15, gy: -0.4, tilt: 2, nod: -5, lh: mL(-286, -222) }],
        [14.4, { ex: 'closed', brow: 15, gy: -0.4, tilt: 3, nod: -6, lh: mL(-286, -222) }],
      ]);
      this.r(lt, t);
      if (lt > 7.8 && lt < 10.4) renee.set(renee.P({ ex: 'brave', gx: -0.8, gy: 0.4, turn: -0.35, tilt: -7.5, lh: mL(-318 + Math.sin(lt * 4) * 12, -322), tear: CD.lerp(0.7, 1, CD.prog(lt, 7.8, 10.4)) }), t);
      // his half: slid to her (2.4 to 3.3), slid back by her (6.2 to 7.0), then he eats it (9.6 on)
      const sh = son.handWorld('r'), mh = renee.handWorld('l');
      let hx = -244, hy = HOOD - 4;
      if (lt >= 2.4 && lt < 3.3) hx = sh[0] + 2;
      else if (lt >= 3.3 && lt < 6.2) hx = -188;
      else if (lt >= 6.2 && lt < 7.0) hx = mh[0] + 2;
      else if (lt >= 7.0 && lt < 9.6) hx = -238;
      else if (lt >= 9.6) { hx = sh[0] + 4; hy = Math.min(HOOD - 4, sh[1] + 20); }
      put(this.his, hx, hy, 0, 1, 0.8);
      put(this.hers, -150, HOOD - 5, 0, 1, 0.8);
    },
    cam: CD.cam({ landscape: [[0, [-205, -322, 620, 340]], [8, [-225, -326, 540, 310]], [14.4, [-215, -334, 480, 290]]],
      portrait: [[0, [-292, -322, 560, 440]], [8, [-272, -326, 500, 410]], [14.4, [-250, -334, 440, 380]]] }),
  },
  // 0:56 night, the phone
  night: {
    bg: '#0d141b', roll: 0.5, shake: 1.8,
    build(g) { this.sc = carScene(g, 'night'); },
    update(t, lt) {
      const { renee, phone } = this.sc, j = Math.sin(lt * 21) * 2.5;
      // she types, stops, shuts her eyes and shakes her head, then starts again
      const stop = lt > 1.7 && lt < 2.6;
      renee.set(renee.P({ ex: stop ? 'closed' : 'worried', brow: stop ? 17 : 14, gy: 0.95, nod: 7, turn: stop ? Math.sin((lt - 1.7) * 7) * 0.18 : 0,
        lh: [-18 + (stop ? 0 : j), -262], rh: [20 - (stop ? 0 : j), -266 + (stop ? 0 : j)] }), t);
      const a = renee.handWorld('l'), b = renee.handWorld('r');
      put(phone, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 12, 0, 1, 1.3);
    },
    cam: CD.cam({ landscape: [[0, [0, -340, 430, 330]], [3.6, [0, -346, 380, 300]]], portrait: [[0, [0, -344, 290, 370]], [3.6, [0, -350, 258, 336]]] }),
  },
  // 1:00 asking
  apply: {
    bg: '#0d1622',
    build(g) { this.u = S.phoneApply(g, { skin: RENEE.skin, taps: TL.taps }); },
    update(t, lt) { this.u(lt); },
    cam: CD.cam({ landscape: [[0, [0, 30, 560, 860]], [7.2, [0, 10, 520, 800]]], portrait: [[0, [0, 40, 470, 840]], [7.2, [0, 20, 440, 790]]] }),
  },
  // 1:07 sent
  night2: {
    bg: '#0d141b', roll: 0.5, shake: 1.6,
    build(g) { this.sc = carScene(g, 'night'); this.sc.phone.style.display = 'none'; this.sc.glow.setAttribute('opacity', 0.5); },
    update(t, lt) {
      this.a = this.a || CD.animate(this.sc.renee, [
        [0, { ex: 'worried', gy: 0.9, nod: 6, shrug: 0.5 }],
        [0.9, { ex: 'closed', brow: 12, smile: 0, nod: 2, shrug: -0.6 }],
